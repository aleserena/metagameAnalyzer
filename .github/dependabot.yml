# Weekly dependency update PRs against staging (the working branch). Minor and patch updates are
# grouped per ecosystem to keep the number of PRs low; majors arrive on their own.
# requirements*.txt are generated: after merging a pip update, run `npm run deps:compile`.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
